name: darksight
description: Radio-wave sensing rendered as a human-readable night-vision view.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  path: ^1.9.0
  share_plus: ^10.1.4
  sqflite: ^2.4.1
  flutter_blue_plus: ^1.35.3
  ffi: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
